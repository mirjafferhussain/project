<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    .parent{
        display: flex;
        justify-content: space-between;
        background-color: rgb(237, 221, 221);
    }
    .name{
        font-size: 50px;
        font-weight: bold;
        margin-left: 190px;
        margin-top: 40px;
    }
    .menu{
        display: flex;
    }
    .home, .about, .contact{
        margin: 30px;
        font-size: 40px;
    }
    .image{
        display: flex;
        justify-content: center;
        height: 500px;
        margin-bottom: 50px;
        margin-top: 60px;
    }
    .header{
        display: flex;
        justify-content: center;
        font-size: 30px;
    }
    .content{
        text-align: center;
        font-size: 40px;
    }
    .post{
        display: flex;
        justify-content: space-around;
        margin-top: 50px;
        color: rgb(15, 6, 1);
        text-decoration: none;
        border-radius: 10px;
        padding:5px;
        font-size: 50px;
        text-align: center;
    }
    .footer{
        display: flex;
        justify-content: space-between;
        margin-top: 50px;
        padding: 30px;
    }
    .hours{
        font-size: 14px;
        padding: 20px;
        color: rgb(74, 0, 0);
        font-family: Arial, Helvetica, sans-serif;
        border-radius: 8px;
    }
    .address{
        font-size: 20px;
        font-weight: bold;
        margin: 50px;
    }
    .email{
        font-size: 20px;
        font-weight: bold;
        margin: 50px;
    }
    .phone{
        font-size: 20px;
        font-weight: bold;
        margin: 50px;
    }
    .car-card{
        margin-left: 500px;
    }
    .menu-items{
        background-color: rgb(228, 238, 227);
        color: rgba(19, 16, 9, 0.432);
        text-decoration: none;
        padding: 10px;
        border-radius: 10px;
    }
</style> 
</head>
<body>
    <div class="parent">
        <div class="logo">
            <img src="image5.jpg" height="200px" width="200px">
            </div>
            <div class="name">AVENGERS</div>
            <div class="menu">
                <div class="home">
                    <a href="home" class="menu-items">home</a>
                </div>
                    <div class="about">
                        <a href="flex.html" class="menu-items">about</a>
            </div>
            <div class="contact">
                <a href="contact" class="menu-items">contact</a>
                </div>
                </div>
    </div>
                <div class="image">
                    <img src="image6.jpg" height="580px" width="770px">
                    </div>
                    <div class="header">
                        <h2>Earth's Mightiest Heroes</h2>
                    </div>
                    <div class="content">
                        <p>Explore the legendary Avengers and discover the heroes who came together to protect the world</p>
                    </div>
                    <div class="post">
                        <div class="post1">
                        <img src="image2.jpg" height="300px" width="300px">
                        <p>Infinity War</p>
                    </div>
                    <div class="post2">
                        <img src="image3.jpg" height="300px" width="300px">
                        <p>The Avengers</p>
                    </div>
                    <div class="post3">
                        <img src="image4.jpg" height="300px" width="300px">
                        <p>Endgame</p>
                    </div>
                    </div>
                    <div class="footer">
                        <u><div class="address">ADDRESS:</u>
                            <p>Avengers Tower New York,USA</p>
                    </div>
                    <u><div class="email">EMAIL:</u>
                        <p>avengers@marvel.com</p>
                    </div>
                    <u><div class="phone">PHONE:</u>
                        <p>800 555 2026</p>
                    </div>
                </div>                
</body>
</html>
